name: Consona
description: Consona Corporation was an Indianapolis, Indiana enterprise software company founded in 1986
  as Made2Manage Systems and taken private by Battery Ventures in 2003. Operating a roll-up strategy, it
  acquired multiple ERP and CRM product lines (DTR, Cimnet, AXIS, Encompix, Intuitive, Relevant, SupplyWorks)
  serving small and midsize manufacturers and field-service businesses. On August 7, 2012 Consona merged
  with CDC Software to form Aptean, and the Consona brand was retired from commercial use. The company is
  defunct, has no live web domain (consona.com does not resolve) and no public API or developer surface;
  its former products live on inside Aptean.
